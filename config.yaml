listen: :8443

tls:
  cert: /etc/hysteria/cert.pem
  key: /etc/hysteria/key.pem

auth:
  type: password
  password: "XmBCjHZ5rvXpVkURxVxfEwv3eXGouuAKcju"

# 有人扫端口时伪装成一个正常网站
masquerade:
  type: proxy
  proxy:
    url: https://www.microsoft.com
    rewriteHost: true

# 关键：按实际带宽填，Brutal 靠这个值决定发送速率
# up  = 服务器上行 = 你的下载速度
# down = 服务器下行 = 你的上传速度
bandwidth:
  up: 200 mbps
  down: 1000 mbps

quic:
  initStreamReceiveWindow: 8388608
  maxStreamReceiveWindow: 8388608
  initConnReceiveWindow: 20971520
  maxConnReceiveWindow: 20971520

# UDP 混淆，能挡掉一部分 DPI 特征
obfs:
  type: salamander
  salamander:
    password: "XrjrDDEdFLupfi6CiKwNz8WC9JU5ubbs0KV"

sniff:
  enabled: true
  timeout: 300ms

acl:
  inline:
    - reject(geoip:private)
